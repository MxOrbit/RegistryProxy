[package]
name = "registry-proxy"
version = "2.0.0"
edition = "2024"
description = "Self-hosted Docker Registry mirror/proxy"
license = "Apache-2.0"
repository = "https://github.com/MxOrbit/RegistryProxy"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
form_urlencoded = "1.2.3"
futures-util = { version = "0.3.34", default-features = false }
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
webpki-root-certs = "1.0.12"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
